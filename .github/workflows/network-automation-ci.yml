name: Network Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  code-validation:
    name: Code Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static analysis
        run: |
          ruff check automation/python tests

      - name: Run unit tests
        run: |
          pytest -v tests/unit

      - name: Validate production change request
        run: |
          python automation/python/change_loader.py


  network-integration:
    name: Containerlab Integration
    runs-on: ubuntu-latest

    needs:
      - code-validation

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Docker
        run: |
          docker version
          docker ps

      - name: Install Containerlab
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: Verify Containerlab
        run: |
          containerlab version
      
      - name: Verify topology files
        run: |
          echo "Workspace: ${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}/topology"
          ls -la "${GITHUB_WORKSPACE}/topology/configs"
          test -f "${GITHUB_WORKSPACE}/topology/topology.clab.yml"

      - name: Deploy FRR topology
        run: |
          sudo containerlab deploy \
            --topo "${GITHUB_WORKSPACE}/topology/topology.clab.yml"

      - name: Show topology
        run: |
          sudo containerlab inspect \
            --topo "${GITHUB_WORKSPACE}/topology/topology.clab.yml"

      - name: Wait for BGP convergence
        run: |
          sleep 15

      - name: Verify FRR containers
        run: |
          docker ps

      - name: Run network integration tests
        run: |
          pytest -v tests/integration -s

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "===== Docker containers ====="
          docker ps -a

          echo "===== leaf1 BGP ====="
          docker exec clab-bgp-automation-leaf1 \
            vtysh -c "show ip bgp summary" || true

          echo "===== leaf2 BGP ====="
          docker exec clab-bgp-automation-leaf2 \
            vtysh -c "show ip bgp summary" || true

          echo "===== leaf1 routes ====="
          docker exec clab-bgp-automation-leaf1 \
            vtysh -c "show ip bgp" || true

          echo "===== leaf2 routes ====="
          docker exec clab-bgp-automation-leaf2 \
            vtysh -c "show ip bgp" || true

      - name: Destroy Containerlab topology
        if: always()
        run: |
          sudo containerlab destroy \
            --topo "${GITHUB_WORKSPACE}/topology/topology.clab.yml" \
            --cleanup