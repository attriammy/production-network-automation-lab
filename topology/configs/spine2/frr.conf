frr version 8.5
frr defaults traditional
hostname spine2
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.1/30
!
interface eth2
 ip address 10.0.22.1/30
!
ip prefix-list ALLOW-ALL seq 10 permit 0.0.0.0/0 le 32
!
route-map ALLOW-ALL permit 10
 match ip address prefix-list ALLOW-ALL
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.0.12.2 remote-as 65101
 neighbor 10.0.22.2 remote-as 65102
 !
 address-family ipv4 unicast
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 route-map ALLOW-ALL in
  neighbor 10.0.12.2 route-map ALLOW-ALL out

  neighbor 10.0.22.2 activate
  neighbor 10.0.22.2 route-map ALLOW-ALL in
  neighbor 10.0.22.2 route-map ALLOW-ALL out
 exit-address-family
!